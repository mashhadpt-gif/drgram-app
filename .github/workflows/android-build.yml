name: DrGram Android Build

on:
  push:
    branches:
      - drgram-new-version-2026
  pull_request:
    branches:
      - drgram-new-version-2026
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-universal-apk:
    name: Build DrGram universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ABIS: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Verify requested version
        shell: bash
        run: |
          APP_VERSION_CODE="$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | tail -n 1)"
          APP_VERSION_NAME="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tail -n 1)"
          test -n "$APP_VERSION_CODE"
          test -n "$APP_VERSION_NAME"
          [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]
          [[ "$APP_VERSION_NAME" =~ ^[0-9]+\.[0-9]+$ ]]
          {
            echo "APP_VERSION_CODE=$APP_VERSION_CODE"
            echo "APP_VERSION_NAME=$APP_VERSION_NAME"
          } >> "$GITHUB_ENV"
          echo "Building DrGram v$APP_VERSION_NAME (code $APP_VERSION_CODE)"

      - name: Build universal APK
        run: ./gradlew --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g" -PAPP_ABIS="$APP_ABIS" :TMessagesProj_App:assembleAfatRelease

      - name: Verify APK output and write build metadata
        shell: bash
        run: |
          test -f TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          ls -lh TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          {
            echo "app_version_name=$APP_VERSION_NAME"
            echo "app_version_code=$APP_VERSION_CODE"
            echo "commit_sha=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "apk_path=TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          } > TMessagesProj_App/build/outputs/apk/afat/release/build-info.txt

      - name: Upload versioned DrGram APK and build metadata
        uses: actions/upload-artifact@v4
        with:
          name: DrGram-universal-APK
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/app.apk
            TMessagesProj_App/build/outputs/apk/afat/release/build-info.txt
          if-no-files-found: error
          retention-days: 30
